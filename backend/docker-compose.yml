  #     - FRAME_INTERVAL=30
  #     - S3_ENDPOINT=${S3_ENDPOINT}
  #     - S3_ACCESS_KEY=${S3_ACCESS_KEY}
  #     - S3_SECRET_KEY=${S3_SECRET_KEY}
  #     - S3_BUCKET=${S3_BUCKET}
  #     - S3_USE_SSL=${S3_USE_SSL:-false}
  #     - S3_REGION=${S3_REGION:-us-east-1}
  #   restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
