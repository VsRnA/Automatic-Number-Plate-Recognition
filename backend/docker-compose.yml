  #     dockerfile: Dockerfile
  #   ports:
  #     - "50051:50051"
  #   volumes:
  #     - ../service-recognition/src:/app/src
  #   depends_on:
  #     - redis
  #   environment:
  #     - GRPC_PORT=50051
